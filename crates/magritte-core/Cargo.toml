[package]
name = "magritte-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UI-agnostic git engine for Magritte: invokes the git CLI and returns structured data."

[dependencies]
magritte-vcs = { workspace = true }
# Move discarded files to the system trash instead of deleting them.
trash = "5"

[dev-dependencies]
tempfile = "3"
